name: Build Android
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web app
        run: |
          echo '{"appId":"com.chessavox.app","appName":"ChessaVox","webDir":"www"}' > capacitor.config.json
          mkdir -p www/lib
          cp index.html www/index.html
          curl -fL -o www/lib/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          curl -fL -o www/lib/chess.min.js https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js
          curl -fL -o www/lib/peerjs.min.js https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#lib/three.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js#lib/chess.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js#lib/peerjs.min.js#' www/index.html
      - name: Make app icon
        run: |
          mkdir -p assets
          python3 - <<'PYEOF'
          import zlib,struct
          W=1024
          poly=[(270,680),(240,380),(400,500),(512,290),(624,500),(784,380),(754,680)]
          def spans(y):
              xs=[]
              for i in range(len(poly)):
                  x1,y1=poly[i];x2,y2=poly[(i+1)%len(poly)]
                  if y1<=y<y2 or y2<=y<y1:
                      xs.append(x1+(y-y1)*(x2-x1)/(y2-y1))
              xs.sort()
              return [(int(xs[i]),int(xs[i+1])) for i in range(0,len(xs)-1,2)]
          def png(path,bg,fg):
              raw=bytearray()
              for y in range(W):
                  row=bytearray(bg*W)
                  if fg:
                      sp=spans(y)
                      if 710<=y<770: sp.append((270,754))
                      for a,b in sp:
                          for x in range(a,b): row[x*4:x*4+4]=fg
                  raw+=b'\x00'+row
              def ch(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              open(path,'wb').write(b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',W,W,8,6,0,0,0))+ch(b'IDAT',zlib.compress(bytes(raw),6))+ch(b'IEND',b''))
          DARK=bytes([23,18,13,255]);GOLD=bytes([212,175,55,255]);NONE=bytes([0,0,0,0])
          png('assets/icon-only.png',DARK,GOLD)
          png('assets/icon-foreground.png',NONE,GOLD)
          png('assets/icon-background.png',DARK,None)
          PYEOF
      - name: Build Android
        run: |
          npm install
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#17120d' || echo icon generation skipped
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          grep RECORD_AUDIO $M
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - name: Sign AAB (optional)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASS }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ks.jks
            jarsigner -keystore ks.jks -storepass "$KP" android/app/build/outputs/bundle/release/app-release.aab "$KA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chess-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
