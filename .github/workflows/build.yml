name: Build Android
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web app
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          curl -fL -o www/lib/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          curl -fL -o www/lib/chess.min.js https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js
          curl -fL -o www/lib/peerjs.min.js https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#lib/three.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js#lib/chess.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js#lib/peerjs.min.js#' www/index.html
      - name: Build Android
        run: |
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          grep RECORD_AUDIO $M
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - name: Sign AAB (optional)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASS }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ks.jks
            jarsigner -keystore ks.jks -storepass "$KP" android/app/build/outputs/bundle/release/app-release.aab "$KA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chess-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
