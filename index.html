<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شطرنج</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{--bg:#efe6d8;--bg2:#fbf6ec;--fg:#2b2118;--card:#fff;--acc:#8b5e3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b08;--bg2:#2b1f15;--fg:#f3e9dc;--card:#2a221b;--acc:#d4af37}}
:root[data-theme="dark"]{--bg:#0f0b08;--bg2:#2b1f15;--fg:#f3e9dc;--card:#2a221b;--acc:#d4af37}
html,body{margin:0}
body{background:var(--bg);background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh}
h1{font-size:20px;margin:4px 0;letter-spacing:1px}
#status{font-size:18px;font-weight:600;margin:4px 0 8px;min-height:26px;text-align:center}
.row{display:flex;gap:8px;margin-bottom:8px}
button{background:var(--card);color:var(--fg);border:2px solid var(--acc);border-radius:10px;padding:8px 14px;font-size:15px;font-family:inherit}
button.on{background:var(--acc);color:var(--bg)}
#wrap{width:min(100%,560px);aspect-ratio:1/1;touch-action:manipulation}
#wrap canvas{display:block;width:100%;height:100%}
input{background:var(--card);color:var(--fg);border:2px solid var(--acc);border-radius:10px;padding:8px;font-size:15px;width:110px;text-align:center;text-transform:uppercase;font-family:inherit}
#olinfo{min-height:20px;font-size:14px;text-align:center;margin-bottom:6px;opacity:.9}
</style>
</head>
<body>
<h1>♛ شطرنج ♛</h1>
<div id="status"></div>
<div class="row" id="lv"></div>
<div class="row"><button id="mbot" class="on">🤖 كمبيوتر</button><button id="mhost">🌐 إنشاء غرفة</button></div>
<div class="row"><input id="rc" placeholder="رمز الغرفة" maxlength="5"><button id="mjoin">انضمام</button><button id="mic" style="display:none">🎙️ شغال</button></div>
<div id="olinfo"></div>
<audio id="ra" autoplay playsinline></audio>
<div id="wrap"></div>
<div class="row" style="margin-top:8px"><button id="undo">↩ تراجع</button><button id="new">لعبة جديدة</button></div>
<script>
var V={p:100,n:320,b:330,r:500,q:900,k:0};
var g=new Chess(),sel=null,hints=[],depth=2,busy=false,think=false,last=[],an=null,mode='bot',me='w';
var wrap=document.getElementById('wrap'),$s=document.getElementById('status');
var R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
wrap.appendChild(R.domElement);
var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.1,100);
C.position.set(0,16,3.2);C.lookAt(0,0,.1);
S.add(new THREE.HemisphereLight(0xffffff,0x553a22,.75));
var L=new THREE.DirectionalLight(0xfff2dd,.9);L.position.set(-5,12,6);L.castShadow=true;L.shadow.mapSize.set(2048,2048);
var sc=L.shadow.camera;sc.left=-7;sc.right=7;sc.top=7;sc.bottom=-7;S.add(L);
function M(c,r,m){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
var frame=new THREE.Mesh(new THREE.BoxGeometry(9.8,.4,9.8),M(0x4a2c17,.45,.15));frame.position.y=-.2;frame.receiveShadow=true;S.add(frame);
var gold=new THREE.Mesh(new THREE.BoxGeometry(8.24,.05,8.24),M(0xd4af37,.3,.7));S.add(gold);
var ML=M(0xe9dab9,.55,.05),MD=M(0x6b4328,.5,.1);
function P(n){return new THREE.Vector3('abcdefgh'.indexOf(n[0])-3.5,.06,8-n[1]-3.5)}
for(var r=0;r<8;r++)for(var c=0;c<8;c++){
  var q=new THREE.Mesh(new THREE.BoxGeometry(1,.06,1),(r+c)%2?MD:ML);
  q.position.set(c-3.5,.03,r-3.5);q.receiveShadow=true;q.userData.sq='abcdefgh'[c]+(8-r);S.add(q);
}
var H=new THREE.Group();S.add(H);
var pg=new THREE.Group();S.add(pg);
var GOLD=M(0xd4af37,.3,.6),tpl={},pm={};
function lathe(a){return new THREE.LatheGeometry(a.map(function(p){return new THREE.Vector2(p[0],p[1])}),40)}
function make(t,col){
  var mat=M(col==='w'?0xf4ead6:0x1d1d24,.32,col==='w'?.05:.35),gr=new THREE.Group();
  function add(geo,x,y,z,m){var o=new THREE.Mesh(geo,m||mat);o.position.set(x,y,z);o.castShadow=true;gr.add(o);return o}
  function sph(r,x,y,z,m,sy){var o=add(new THREE.SphereGeometry(r,24,18),x,y,z,m);if(sy)o.scale.y=sy;return o}
  var pr={
    p:[[0,0],[.4,0],[.42,.05],[.36,.12],[.22,.2],[.14,.36],[.2,.42],[.22,.46],[.14,.5],[0,.5]],
    r:[[0,0],[.42,0],[.44,.05],[.38,.13],[.26,.22],[.22,.6],[.3,.66],[.34,.72],[.34,.8],[0,.8]],
    b:[[0,0],[.42,0],[.44,.05],[.38,.13],[.24,.22],[.16,.5],[.24,.56],[.14,.6],[0,.6]],
    q:[[0,0],[.44,0],[.46,.05],[.4,.14],[.26,.25],[.18,.6],[.28,.7],[.3,.82],[.2,.86],[0,.86]],
    k:[[0,0],[.46,0],[.48,.05],[.42,.14],[.28,.26],[.2,.7],[.32,.8],[.34,.92],[.24,.98],[0,.98]],
    n:[[0,0],[.42,0],[.44,.05],[.38,.13],[.3,.2],[0,.2]]
  }[t];
  add(lathe(pr),0,0,0);
  if(t==='p')sph(.22,0,.64,0,M(0xd4af37,.25,.5));
  if(t==='r'){for(var i=0;i<6;i++){var a=i*Math.PI/3,o=add(new THREE.BoxGeometry(.16,.16,.14),Math.cos(a)*.26,.88,Math.sin(a)*.26);o.rotation.y=-a}}
  if(t==='b'){sph(.2,0,.8,0,0,1.5);sph(.06,0,1.1,0,GOLD)}
  if(t==='q'){for(var j=0;j<8;j++){var b=j*Math.PI/4;sph(.07,Math.cos(b)*.25,.92,Math.sin(b)*.25,GOLD)}sph(.13,0,1.02,0,mat)}
  if(t==='k'){var tr=add(new THREE.TorusGeometry(.26,.06,12,32),0,1.0,0,GOLD);tr.rotation.x=Math.PI/2;sph(.2,0,1.08,0,mat,.8);sph(.09,0,1.28,0,GOLD)}
  if(t==='n'){
    var sh=new THREE.Shape();
    [[-.3,0],[.3,0],[.22,.3],[.32,.48],[.6,.46],[.64,.58],[.42,.8],[.3,.98],[.15,.86],[.02,.98],[-.12,.78],[-.3,.45],[-.32,.2]].forEach(function(p,i){i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1])});
    var gm=new THREE.ExtrudeGeometry(sh,{depth:.3,bevelEnabled:true,bevelSize:.05,bevelThickness:.05,bevelSegments:3});
    gm.translate(0,0,-.15);var h=add(gm,0,.2,0);h.scale.set(.9,.9,.9);h.rotation.y=col==='w'?Math.PI/2:-Math.PI/2;
  }
  return gr;
}
function build(t,col){var k=t+col;if(!tpl[k])tpl[k]=make(t,col);return tpl[k].clone()}
function plane(n,col,op,geo){var m=new THREE.Mesh(geo||new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;var p=P(n);m.position.set(p.x,.075,p.z);H.add(m)}
function drawH(){
  while(H.children.length)H.remove(H.children[0]);
  last.forEach(function(n){plane(n,0xf6d04d,.35)});
  if(sel)plane(sel,0xffd24a,.6);
  hints.forEach(function(n){g.get(n)?plane(n,0xe5484d,.85,new THREE.RingGeometry(.36,.47,32)):plane(n,0x2e7d4f,.75,new THREE.CircleGeometry(.16,24))});
}
function sync(){
  while(pg.children.length)pg.remove(pg.children[0]);pm={};
  g.board().forEach(function(row,r){row.forEach(function(p,c){
    if(!p)return;var n='abcdefgh'[c]+(8-r),o=build(p.type,p.color);
    o.position.copy(P(n));o.traverse(function(x){x.userData.sq=n});pg.add(o);pm[n]=o;
  })});
  drawH();status();
}
function status(){
  var t;
  if(g.in_checkmate())t=g.turn()===me?(mode==='online'?'كش مات! خسرت':'كش مات! فاز الكمبيوتر 🤖'):'كش مات! فزت 🎉';
  else if(g.in_draw())t='تعادل 🤝';
  else if(think)t='الكمبيوتر يفكر...';
  else if(mode==='online')t=g.turn()===me?(g.in_check()?'كش! دورك':'دورك'):'دور الخصم...';
  else t=g.in_check()?'كش! دورك':'دورك (الأبيض)';
  $s.textContent=t;
}
function loop(t){
  requestAnimationFrame(loop);
  if(an){var p=Math.min(1,(t-an.s)/380),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    an.m.position.lerpVectors(an.f,an.t,e);an.m.position.y=.06+Math.sin(Math.PI*p)*.7;
    if(p>=1){var cb=an.cb;an=null;cb()}}
  R.render(S,C);
}
function play(m,done){
  var mesh=pm[m.from];g.move({from:m.from,to:m.to,promotion:'q'});
  last=[m.from,m.to];sel=null;hints=[];busy=true;drawH();status();
  an={m:mesh,f:mesh.position.clone(),t:P(m.to),s:performance.now(),cb:function(){busy=false;sync();done&&done()}};
}
function evalB(){var s=0;g.board().forEach(function(row){row.forEach(function(p){if(p)s+=(p.color==='b'?1:-1)*V[p.type]})});return s}
function search(d,a,b,mx){
  if(g.in_checkmate())return mx?-1e5-d:1e5+d;
  if(d===0||g.game_over())return evalB();
  var ms=g.moves();
  for(var i=0;i<ms.length;i++){
    g.move(ms[i]);var v=search(d-1,a,b,!mx);g.undo();
    if(mx){if(v>a)a=v}else{if(v<b)b=v}
    if(b<=a)break;
  }
  return mx?a:b;
}
function bot(){
  if(g.game_over()){status();return}
  think=true;status();
  setTimeout(function(){
    var ms=g.moves({verbose:true}),best=null,bv=-1e9;
    ms.sort(function(){return Math.random()-.5});
    for(var i=0;i<ms.length;i++){
      g.move({from:ms[i].from,to:ms[i].to,promotion:'q'});var v=search(depth-1,-1e9,1e9,false);g.undo();
      if(v>bv){bv=v;best=ms[i]}
    }
    think=false;
    if(best)play(best);else sync();
  },60);
}
R.domElement.addEventListener('click',function(e){
  if(busy||think||g.game_over())return;
  if(mode==='online'&&(!conn||!conn.open||g.turn()!==me))return;
  var b=R.domElement.getBoundingClientRect(),rc=new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1),C);
  var hs=rc.intersectObjects(S.children,true),n=null;
  for(var i=0;i<hs.length;i++){if(hs[i].object.userData.sq){n=hs[i].object.userData.sq;break}}
  if(!n)return;
  if(sel&&hints.indexOf(n)>-1){if(mode==='online')conn.send({t:'move',from:sel,to:n});play({from:sel,to:n},mode==='bot'?bot:null);return}
  var p=g.get(n);
  if(p&&p.color===g.turn()){sel=n;hints=g.moves({square:n,verbose:true}).map(function(m){return m.to})}
  else{sel=null;hints=[]}
  drawH();
});
document.getElementById('new').onclick=function(){if(busy||think)return;if(mode==='online'&&conn&&conn.open)conn.send({t:'new'});resetGame()};
document.getElementById('undo').onclick=function(){if(busy||think||mode==='online')return;g.undo();if(g.turn()==='b')g.undo();sel=null;hints=[];last=[];sync()};
var lv=document.getElementById('lv');
[['سهل',1],['متوسط',2],['صعب',3]].forEach(function(x){
  var b=document.createElement('button');b.textContent=x[0];if(x[1]===depth)b.className='on';
  b.onclick=function(){depth=x[1];[].forEach.call(lv.children,function(k){k.className=''});b.className='on'};lv.appendChild(b);
});
var peer=null,conn=null,stream=null,micOn=true,$o=document.getElementById('olinfo'),$m=document.getElementById('mic');
function info(t){$o.textContent=t}
function cam(){C.position.set(0,16,me==='b'?-3.2:3.2);C.lookAt(0,0,me==='b'?-.1:.1)}
function resetGame(){g=new Chess();sel=null;hints=[];last=[];think=false;busy=false;an=null;sync()}
function setMode(m,c){mode=m;me=c||'w';cam();resetGame()}
function closeNet(){try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}if(stream)stream.getTracks().forEach(function(t){t.stop()});peer=conn=stream=null;$m.style.display='none'}
function silent(){var a=new (window.AudioContext||window.webkitAudioContext)();return a.createMediaStreamDestination().stream}
function getMic(cb){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){stream=silent();return cb(stream)}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(s){stream=s;cb(s)}).catch(function(){stream=silent();info('المايك غير مسموح - اللعب شغال بدون صوتك');cb(stream)});
}
function remoteAudio(s){var a=document.getElementById('ra');a.srcObject=s;var p=a.play();if(p&&p.catch)p.catch(function(){})}
function answerCalls(){peer.on('call',function(call){call.answer(stream);call.on('stream',remoteAudio)})}
function recv(d){if(busy||an){setTimeout(function(){recv(d)},150);return}play({from:d.from,to:d.to})}
function wire(c){
  c.on('data',function(d){if(d.t==='move')recv(d);else if(d.t==='new')resetGame()});
  c.on('close',function(){info('انقطع الاتصال')});
}
function netErr(e){info('تعذّر الاتصال ('+(e&&e.type?e.type:'خطأ')+') - تأكد من الإنترنت والرمز')}
function showMic(){$m.style.display='';$m.textContent=micOn?'🎙️ شغال':'🔇 مكتوم'}
function host(){
  if(typeof Peer==='undefined'){info('الأونلاين يحتاج تطبيق الجوال أو اتصال إنترنت');return}
  closeNet();var cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',id='';for(var i=0;i<5;i++)id+=cs[Math.floor(Math.random()*cs.length)];
  setMode('online','w');info('جاري إنشاء الغرفة...');
  getMic(function(){
    peer=new Peer('chessar-'+id);
    peer.on('error',netErr);
    peer.on('open',function(){info('رمز الغرفة: '+id+' — أرسله لصديقك')});
    peer.on('connection',function(c){
      if(conn&&conn.open){c.close();return}
      conn=c;wire(c);
      c.on('open',function(){info('صديقك دخل! أنت الأبيض ♔');showMic();var cl=peer.call(c.peer,stream);cl.on('stream',remoteAudio)});
    });
  });
}
function join(){
  var id=document.getElementById('rc').value.trim().toUpperCase();if(!id)return;
  if(typeof Peer==='undefined'){info('الأونلاين يحتاج تطبيق الجوال أو اتصال إنترنت');return}
  closeNet();setMode('online','b');info('جاري الاتصال...');
  getMic(function(){
    peer=new Peer();
    peer.on('error',netErr);
    answerCalls();
    peer.on('open',function(){
      var c=peer.connect('chessar-'+id,{reliable:true});conn=c;wire(c);
      c.on('open',function(){info('اتصلت! أنت الأسود ♚');showMic()});
    });
  });
}
document.getElementById('mhost').onclick=host;
document.getElementById('mjoin').onclick=join;
document.getElementById('mbot').onclick=function(){closeNet();setMode('bot','w');info('')};
$m.onclick=function(){micOn=!micOn;if(stream)stream.getAudioTracks().forEach(function(t){t.enabled=micOn});showMic()};
function rs(){var w=wrap.clientWidth,h=wrap.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
window.addEventListener('resize',rs);rs();sync();requestAnimationFrame(loop);
</script>
</body>
</html>
