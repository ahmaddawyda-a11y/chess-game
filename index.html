<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChessaVox</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#17120d;--bg2:#2b1f15;--fg:#f3e9dc;--card:#241b13;--acc:#d4af37;--line:#5a4630;--mut:#bfae95;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg));color:var(--fg);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
.scr{width:100%;max-width:560px;box-sizing:border-box;display:flex;flex-direction:column}
#home{padding:32px 20px 24px;gap:14px;position:relative}
.panel{display:flex;flex-direction:column;gap:14px}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:6px}
h1{margin:0;font-size:38px;font-weight:900;color:var(--acc)}
.sub{font-size:14px;color:var(--mut);text-align:center}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
select,input{height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-size:17px;font-family:inherit;padding:0 14px;box-sizing:border-box}
input{text-align:center;text-transform:uppercase}
button{font-family:inherit;cursor:pointer;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:0 5px 0 #0c0805,0 10px 14px rgba(0,0,0,.4);font-size:16px;font-weight:700;min-height:52px;padding:8px 16px}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #0c0805}
.big{text-align:start;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.big b{font-size:18px}.big small{font-size:13px;opacity:.8;font-weight:400}
.pri{background:var(--acc);color:#17120d;border:0;box-shadow:0 5px 0 #9a7b17,0 10px 14px rgba(0,0,0,.4)}
#olinfo{min-height:20px;font-size:14px;text-align:center;color:var(--mut)}
#lv{display:flex;flex-direction:column;gap:14px}#lv button{min-height:64px;font-size:18px}
.rowc{display:flex;gap:10px}.rowc input{flex:1;min-width:0}
#game{display:none;position:relative;padding-top:10px;gap:6px}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.top button{min-height:44px;min-width:44px;font-size:15px}
.strip{display:flex;align-items:center;gap:10px;padding:0 16px;height:34px;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;background:var(--acc)}
#wrap{width:100%;aspect-ratio:1/1.1;touch-action:manipulation}
#wrap canvas{display:block;width:100%;height:100%}
#status{text-align:center;font-size:20px;font-weight:900;color:var(--acc);min-height:30px}
.row{display:flex;gap:10px;padding:0 16px 14px}.row button{flex:1}
#ov{display:none;position:fixed;inset:0;background:rgba(10,7,4,.78);flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 28px;text-align:center;z-index:5}
#mt{font-size:60px;font-weight:900;color:var(--acc);line-height:1.1}
#ovs{font-size:22px;font-weight:700}
#ov button{width:100%;max-width:340px}
#ask{display:none;position:fixed;inset:0;background:rgba(10,7,4,.85);flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 28px;text-align:center;z-index:9;font-size:22px;font-weight:700}
#ask button{width:100%;max-width:340px}
#toast{display:none;position:fixed;left:16px;right:16px;bottom:24px;background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:12px;text-align:center;z-index:10;font-weight:700}
.cap{margin-inline-start:auto;display:flex;font-size:22px;line-height:1;direction:ltr}
#prof{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
#lvl{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#17120d;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#pname{height:30px;border:0;background:transparent;text-align:start;text-transform:none;padding:0;font-size:18px;font-weight:700;width:100%}
.bar{height:8px;border-radius:4px;background:#0c0805;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.pi small{color:var(--mut)}
#ovlv{font-size:26px;font-weight:900;color:var(--acc)}
.top button{font-size:18px}
#avatar{position:absolute;top:16px;inset-inline-end:16px;width:54px;height:54px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--acc);background:var(--card);color:var(--acc);font-size:22px;font-weight:900}
#avatar b{position:absolute;bottom:-4px;inset-inline-start:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#17120d;font-size:12px;line-height:22px}
.panel h2,.panel h3{margin:4px 0;color:var(--acc)}
#themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
#themes button{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;font-size:15px}
#themes .sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#themes i{width:28px;height:28px;border-radius:50%;flex:none}
input[type=range]{height:auto;padding:0;border:0;background:transparent;accent-color:#d4af37}
#chat{display:none;position:fixed;left:0;right:0;bottom:0;height:60%;max-width:560px;margin:0 auto;background:var(--bg2);border-top:2px solid var(--acc);flex-direction:column;gap:8px;padding:12px;z-index:8;box-sizing:border-box}
#cmsgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--card);align-self:flex-start;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--acc);color:#17120d}
#cbad{color:#ff6b5e;font-size:12px}
</style>
</head>
<body>
<div id="home" class="scr">
<div class="logo"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 48 L4 18 L20 30 L32 10 L44 30 L60 18 L56 48 Z" fill="#d4af37"/><rect x="8" y="50" width="48" height="7" rx="3" fill="#d4af37"/></svg><h1 id="h1"></h1><div class="sub" data-i="tag"></div></div>
<button id="avatar"><span id="avl"></span><b id="avb"></b></button>
<div id="pmain" class="panel">
<label class="fld"><span data-i="langlbl"></span><select id="lang"><option value="ar">العربية</option><option value="en">English</option><option value="es">Español</option><option value="tr">Türkçe</option><option value="fr">Français</option></select></label>
<button id="bonline" class="big pri"><b data-i="online"></b><small data-i="onlined"></small></button><button id="bfriend" class="big"><b data-i="friend"></b><small data-i="friendd"></small></button><button id="baddf" class="big"><b data-i="addf"></b><small data-i="addfd"></small></button><button id="bbot" class="big"><b data-i="botbtn"></b><small data-i="botd"></small></button>
</div>
<div id="pfriend" class="panel" style="display:none">
<button id="mhost" data-i="host"></button>
<div class="rowc"><input id="rc" maxlength="5"><button id="mjoin" data-i="join"></button></div>
<button class="pback" data-i="back"></button>
</div>
<div id="plevel" class="panel" style="display:none"><div id="lv"></div><button class="pback" data-i="back"></button></div>
<div id="pacc" class="panel" style="display:none">
<h2 data-i="acc"></h2>
<div id="prof"><div id="lvl">1</div><div class="pi"><input id="pname" maxlength="14"><div class="bar"><i id="xpb"></i></div><small id="xpt"></small><small id="stt"></small></div></div>
<h3 data-i="boards"></h3><div id="themes"></div>
<h3 data-i="sound"></h3>
<div class="rowc"><button id="sndb"></button><button id="sndt" data-i="test"></button></div>
<label class="fld"><span data-i="vol"></span><input type="range" id="vol" min="0" max="100"></label>
<select id="sty"><option value="0"></option><option value="1"></option><option value="2"></option></select>
<button class="pback" data-i="back"></button>
</div>
<div id="olinfo"></div>
</div>
<div id="game" class="scr">
<div class="top"><button id="gback" data-i="home"></button><button id="chatb" style="display:none">💬<sup id="cbad"></sup></button><button id="rmute" style="display:none">🔊</button><button id="mic" style="display:none"></button></div>
<div class="strip"><span class="dot"></span><span id="n2"></span><span class="cap" id="cap2"></span></div>
<div id="wrap"></div>
<div class="strip"><span class="dot"></span><span id="n1"></span><span class="cap" id="cap1"></span></div>
<div id="status"></div>
<div class="row"><button id="undo" data-i="undo"></button><button id="new" data-i="new"></button></div>
<div id="ov"><div id="mt"></div><div id="ovs"></div><div id="ovlv"></div><button id="ovnew" class="pri" data-i="new"></button><button id="ovhome" data-i="home"></button></div>
</div>
<div id="chat"><div id="cmsgs"></div><div class="rowc"><input id="cin" maxlength="120"><button id="csend" data-i="send"></button></div><button id="cclose" data-i="close"></button></div>
<div id="ask"><div id="askt"></div><button id="askyes" class="pri" data-i="accept"></button><button id="askno" data-i="decline"></button></div>
<div id="toast"></div>
<audio id="ra" autoplay playsinline></audio>
<script>
var V={p:100,n:320,b:330,r:500,q:900,k:0};
var AC=null,sndOn=true,rewarded=false,PR={xp:0,w:0,l:0,d:0,name:''};
try{var sv=JSON.parse(localStorage.getItem('prof')||'null');if(sv)PR=sv}catch(e){}
sndOn=PR.snd!==false;
function lvOf(x){return Math.floor((1+Math.sqrt(1+4*x/25))/2)}
function saveP(){try{localStorage.setItem('prof',JSON.stringify(PR))}catch(e){}}
function drawP(){
  var L=lvOf(PR.xp),a=25*L*(L-1),b=25*(L+1)*L,pn=document.getElementById('pname');
  document.getElementById('lvl').textContent=L;pn.placeholder=t('guest');if(document.activeElement!==pn)pn.value=PR.name||'';
  document.getElementById('xpb').style.width=Math.round((PR.xp-a)/(b-a)*100)+'%';
  document.getElementById('xpt').textContent=t('level')+' '+L+' · XP '+(PR.xp-a)+'/'+(b-a);
  document.getElementById('stt').textContent=t('wins')+' '+PR.w+' · '+t('losses')+' '+PR.l+' · '+t('draws')+' '+PR.d;
  document.getElementById('avl').textContent=(PR.name||t('guest')).charAt(0).toUpperCase();document.getElementById('avb').textContent=L;
}
function award(){
  var win=g.in_checkmate()&&g.turn()!==me,loss=g.in_checkmate()&&g.turn()===me,ad,before=lvOf(PR.xp);
  if(win){ad=mode==='online'?40:({1:10,2:20,3:40}[depth]||20);PR.w++}else if(loss){ad=3;PR.l++}else{ad=5;PR.d++}
  PR.xp+=ad;saveP();
  document.getElementById('ovs').textContent+=' +'+ad+' XP';
  var after=lvOf(PR.xp);if(after>before){document.getElementById('ovlv').textContent=t('levelup')+' '+after;snd('win')}
  drawP();
}
var THEMES=[[0xe9dab9,0x6b4328,0x4a2c17,0xd4af37],[0xeeeef2,0x7b8494,0x2f3542,0xc0c7d1],[0xeeeed2,0x6f9a55,0x2a3b22,0xd4af37],[0xdbe7f0,0x4f7ca3,0x1d2d44,0x9ecbe8],[0x9aa1b5,0x3a3f55,0x14161f,0xd4af37]];
function hx(n){return '#'+('000000'+n.toString(16)).slice(-6)}
function setTheme(i){var h=THEMES[i]||THEMES[0];ML.color.set(h[0]);MD.color.set(h[1]);frame.material.color.set(h[2]);gold.material.color.set(h[3]);PR.th=i;saveP();drawThemes()}
function drawThemes(){
  var box=document.getElementById('themes');box.innerHTML='';
  THEMES.forEach(function(h,i){var b=document.createElement('button');if(i===(PR.th||0))b.className='sel';
    b.innerHTML='<i style="background:linear-gradient(135deg,'+hx(h[0])+' 50%,'+hx(h[1])+' 50%)"></i>';
    b.appendChild(document.createTextNode(t('th'+i)));b.onclick=function(){setTheme(i)};box.appendChild(b)});
}
function drawSnd(){
  document.getElementById('sndb').textContent=t('sound')+': '+(sndOn?t('on'):t('off'));
  var o=document.getElementById('sty').options;for(var i=0;i<3;i++)o[i].textContent=t('sty'+i);
  document.getElementById('sty').value=PR.sty||0;document.getElementById('vol').value=Math.round((PR.vol==null?.8:PR.vol)*100);
}
function drawAcc(){drawP();drawThemes();drawSnd()}
var unread=0;
function badge(){document.getElementById('cbad').textContent=unread?unread:''}
function openChat(o){document.getElementById('chat').style.display=o?'flex':'none';if(o){unread=0;badge();var m=document.getElementById('cmsgs');m.scrollTop=m.scrollHeight}}
function addMsg(txt,mine,who){var m=document.getElementById('cmsgs'),d=document.createElement('div');d.className='msg'+(mine?' me':'');d.textContent=(mine?'':who+': ')+txt;m.appendChild(d);m.scrollTop=m.scrollHeight}
function gotChat(d){addMsg(String(d.m||'').slice(0,120),false,String(d.n||t('opp2')).slice(0,14));if(document.getElementById('chat').style.display!=='flex'){unread++;badge()}snd('chat')}
function sendChat(){var i=document.getElementById('cin'),v=i.value.trim();if(!v||!conn||!conn.open)return;conn.send({t:'chat',m:v.slice(0,120),n:PR.name||t('guest')});addMsg(v,true);i.value=''}
var G0={p:8,n:2,b:2,r:2,q:1},GL={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛'};
function drawCap(){
  var cnt={w:{p:0,n:0,b:0,r:0,q:0},b:{p:0,n:0,b:0,r:0,q:0}};
  g.board().forEach(function(row){row.forEach(function(p){if(p&&p.type!=='k')cnt[p.color][p.type]++})});
  function lost(c){var h='',st=c==='w'?'color:#f3e9dc':'color:#111;text-shadow:0 0 2px #e8d9c0,0 0 2px #e8d9c0';
    ['q','r','b','n','p'].forEach(function(k){for(var i=0;i<G0[k]-cnt[c][k];i++)h+='<span style="'+st+'">'+GL[k]+'&#xFE0E;</span>'});return h}
  document.getElementById('cap2').innerHTML=lost(me==='w'?'b':'w');document.getElementById('cap1').innerHTML=lost(me);
}
function arrow(){
  if(last.length<2)return;var a=P(last[0]),b=P(last[1]),dx=b.x-a.x,dz=b.z-a.z,L=Math.sqrt(dx*dx+dz*dz);if(L<.1)return;
  var gp=new THREE.Group();gp.position.set(a.x,.1,a.z);gp.rotation.y=-Math.atan2(dz,dx);
  var mt=new THREE.MeshBasicMaterial({color:0x32d583,transparent:true,opacity:.85,depthTest:false});
  var sh=new THREE.Mesh(new THREE.BoxGeometry(L-.35,.05,.14),mt);sh.position.x=(L-.35)/2;sh.renderOrder=5;gp.add(sh);
  var hd=new THREE.Mesh(new THREE.ConeGeometry(.22,.4,16),mt);hd.rotation.z=-Math.PI/2;hd.position.x=L-.2;hd.renderOrder=5;gp.add(hd);
  H.add(gp);
}
function snd(k){
  if(!sndOn)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    var t0=AC.currentTime,VOL=PR.vol==null?.8:PR.vol,ST=PR.sty||0;
    function tone(f,d,at,ty,v){v=(v||.25)*VOL;if(ST===1){f*=2;d*=1.8;ty='sine'}else if(ST===2){f*=.8;ty='sine';v*=.7}var o=AC.createOscillator(),gn=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t0+at);gn.gain.setValueAtTime(0,t0+at);gn.gain.linearRampToValueAtTime(v,t0+at+.01);gn.gain.exponentialRampToValueAtTime(.001,t0+at+d);o.connect(gn);gn.connect(AC.destination);o.start(t0+at);o.stop(t0+at+d+.02)}
    if(k==='move'){tone(180,.09,0,'triangle',.35);tone(110,.12,0,'sine',.3)}
    else if(k==='cap'){tone(140,.1,0,'sawtooth',.25);tone(90,.18,0,'triangle',.4);tone(220,.08,.05,'square',.12)}
    else if(k==='check'){tone(660,.12,0,'square',.15);tone(880,.18,.12,'square',.15)}
    else if(k==='mate'){[523,415,330,262].forEach(function(f,i){tone(f,.45,i*.22,'triangle',.3)});tone(131,1,.9,'sawtooth',.2)}
    else if(k==='chat'){tone(880,.08,0,'sine',.2);tone(1175,.1,.08,'sine',.2)}
    else if(k==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,.3,i*.14,'triangle',.3)})}
  }catch(e){}

function search(d,a,b,mx){
  if(g.in_checkmate())return mx?-1e5-d:1e5+d;
  if(d===0||g.game_over())return evalB();
  var ms=g.moves();
  for(var i=0;i<ms.length;i++){
    g.move(ms[i]);var v=search(d-1,a,b,!mx);g.undo();
    if(mx){if(v>a)a=v}else{if(v<b)b=v}
    if(b<=a)break;
  }
  return mx?a:b;
}
function bot(){
  if(g.game_over()){status();return}
  think=true;status();
  setTimeout(function(){
    var ms=g.moves({verbose:true}),best=null,bv=-1e9;
    ms.sort(function(){return Math.random()-.5});
    for(var i=0;i<ms.length;i++){
      g.move({from:ms[i].from,to:ms[i].to,promotion:'q'});var v=search(depth-1,-1e9,1e9,false);g.undo();
      if(v>bv){bv=v;best=ms[i]}
    }
    think=false;
    if(best)play(best);else sync();
  },60);
}
R.domElement.addEventListener('click',function(e){
  if(busy||think||g.game_over())return;
  if(mode==='online'&&(!conn||!conn.open||g.turn()!==me))return;
  var b=R.domElement.getBoundingClientRect(),rc=new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1),C);
  var hs=rc.intersectObjects(S.children,true),n=null;
  for(var i=0;i<hs.length;i++){if(hs[i].object.userData.sq){n=hs[i].object.userData.sq;break}}
  if(!n)return;
  if(sel&&hints.indexOf(n)>-1){if(mode==='online')conn.send({t:'move',from:sel,to:n});play({from:sel,to:n},mode==='bot'?bot:null);return}
  var p=g.get(n);
  if(p&&p.color===g.turn()){sel=n;hints=g.moves({square:n,verbose:true}).map(function(m){return m.to})}
  else{sel=null;hints=[]}
  drawH();
});

document.getElementById('askyes').onclick=function(){document.getElementById('ask').style.display='none';if(conn&&conn.open)conn.send({t:'newok'});resetGame()};
document.getElementById('askno').onclick=function(){document.getElementById('ask').style.display='none';if(conn&&conn.open)conn.send({t:'newno'})};
document.getElementById('undo').onclick=function(){if(busy||think||mode==='online')return;g.undo();if(g.turn()==='b')g.undo();sel=null;hints=[];last=[];sync()};
var lv=document.getElementById('lv');
[['easy',1],['mid',2],['hard',3]].forEach(function(x){

});
var peer=null,conn=null,stream=null,micOn=true,$o=document.getElementById('olinfo'),$m=document.getElementById('mic');
function info(t){$o.textContent=t}
function cam(){C.position.set(0,16,me==='b'?-3.2:3.2);C.lookAt(0,0,me==='b'?-.1:.1)}
function toast(m){var e=document.getElementById('toast');e.textContent=m||'';e.style.display=m?'block':'none'}
function resetGame(){g=new Chess();sel=null;hints=[];last=[];think=false;busy=false;an=null;toast('');rewarded=false;document.getElementById('ask').style.display='none';sync()}
function reqNew(){if(mode==='online'&&conn&&conn.open){conn.send({t:'newreq'});toast(t('waitnew'))}else resetGame()}
function setMode(m,c){mode=m;me=c||'w';cam();resetGame()}
function closeNet(){try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}if(stream)stream.getTracks().forEach(function(t){t.stop()});peer=conn=stream=null;$m.style.display='none'}
function silent(){var a=new (window.AudioContext||window.webkitAudioContext)();return a.createMediaStreamDestination().stream}
function getMic(cb){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){stream=silent();return cb(stream)}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(s){stream=s;cb(s)}).catch(function(){stream=silent();info(t('nomic'));cb(stream)});
}
function remoteAudio(s){var a=document.getElementById('ra');a.srcObject=s;var p=a.play();if(p&&p.catch)p.catch(function(){})}
function answerCalls(){peer.on('call',function(call){call.answer(stream);call.on('stream',remoteAudio)})}
function recv(d){if(busy||an){setTimeout(function(){recv(d)},150);return}play({from:d.from,to:d.to})}
function wire(c){
  c.on('data',function(d){if(d.t==='move')recv(d);else if(d.t==='chat')gotChat(d);else if(d.t==='newreq'){document.getElementById('askt').textContent=t('newreq');document.getElementById('ask').style.display='flex'}else if(d.t==='newok')resetGame();else if(d.t==='newno'){toast(t('declined'));setTimeout(function(){toast('')},2500)}});
  c.on('close',function(){info(t('disc'))});
}
function netErr(e){info(t('neterr')+' ('+(e&&e.type?e.type:'error')+')')}
function showMic(){$m.style.display='';$m.textContent=micOn?t('micon'):t('micoff')}
function rid(){var cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<5;i++)s+=cs[Math.floor(Math.random()*cs.length)];return s}
function host(){hostRoom(rid())}
function hostRoom(id){
  if(typeof Peer==='undefined'){info(t('noonline'));return}
  closeNet();
  setMode('online','w');info(t('creating'));
  getMic(function(){
    peer=new Peer('chessar-'+id);
    peer.on('error',netErr);
    peer.on('open',function(){info(t('room')+' '+id+' — '+t('share'))});
    peer.on('connection',function(c){
      if(conn&&conn.open){c.close();return}
      conn=c;wire(c);
      c.on('open',function(){info(t('friendin'));showMic();goGame();var cl=peer.call(c.peer,stream);cl.on('stream',remoteAudio)});
    });
  });
}
function join(){var id=document.getElementById('rc').value.trim().toUpperCase();if(id)joinRoom(id)}
function joinRoom(id){
  if(typeof Peer==='undefined'){info(t('noonline'));return}
  closeNet();setMode('online','b');info(t('connecting'));
  getMic(function(){
    peer=new Peer();var tries=0;
    function go(){var c=peer.connect('chessar-'+id,{reliable:true});conn=c;wire(c);c.on('open',function(){info(t('connected'));showMic();goGame()})}
    peer.on('error',function(e){if(e&&e.type==='peer-unavailable'&&tries++<6){setTimeout(go,1500)}else netErr(e)});
    answerCalls();
    peer.on('open',go);
  });
}
document.getElementById('mhost').onclick=host;
document.getElementById('mjoin').onclick=join;
function showPanel(p){['pmain','pfriend','plevel','pacc'].forEach(function(i){document.getElementById(i).style.display=i===p?'flex':'none'})}
function goGame(){
  document.getElementById('home').style.display='none';document.getElementById('game').style.display='flex';
  document.getElementById('n2').textContent=mode==='bot'?t('comp'):t('opp2');document.getElementById('n1').textContent=(PR.name||t('you'))+' · '+t('lv')+' '+lvOf(PR.xp);
  document.getElementById('undo').style.display=mode==='bot'?'':'none';document.getElementById('chatb').style.display=mode==='online'?'':'none';document.getElementById('rmute').style.display=mode==='online'?'':'none';
  rs();sync();
}
function goHome(){
  closeNet();setMode('bot','w');info('');document.getElementById('cmsgs').innerHTML='';openChat(false);unread=0;badge();document.getElementById('ra').muted=false;document.getElementById('rmute').textContent='🔊';
  document.getElementById('game').style.display='none';document.getElementById('home').style.display='flex';showPanel('pmain');
}
function startBot(){closeNet();setMode('bot','w');info('');goGame()}
function quick(){
  if(typeof Peer==='undefined'){info(t('noonline'));return}
  closeNet();info(t('searching'));
  getMic(function(){
    peer=new Peer('chessar-queue');
    peer.on('connection',function(c){
      c.on('open',function(){var id=rid();c.send({t:'room',id:id});setTimeout(function(){hostRoom(id)},700)});
    });
    peer.on('error',function(e){
      if(e&&e.type==='unavailable-id'){
        try{peer.destroy()}catch(x){}
        peer=new Peer();
        peer.on('error',netErr);
        peer.on('open',function(){
          var c=peer.connect('chessar-queue',{reliable:true});
          c.on('data',function(d){if(d&&d.t==='room')joinRoom(d.id)});
          setTimeout(function(){if(!conn)info(t('nomatch'))},9000);
        });
      }else netErr(e);
    });
  });
}
document.getElementById('bonline').onclick=quick;

document.getElementById('bbot').onclick=function(){showPanel('plevel')};
